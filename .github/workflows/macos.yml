# The Mac version on a real Mac, every push: unit tests on the Python and bash macOS ships (3.9 / 3.2), then DYMO
# Connect for Mac's driver + tools/install-all.sh + a print of a tag and a 4×6 through that driver to the fake
# LabelWriter (tests/print_check.py checks size, margins and orientation of what the "printer" got).
name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DYMO_PKG_URL: https://download.dymo.com/dymo/Software/Mac/DCDMac1.4.3.103.pkg
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (macOS's own python3 and bash)
        run: |
          /usr/bin/python3 --version; /bin/bash --version | head -1
          git config --global user.name ci; git config --global user.email ci@example.invalid
          /usr/bin/python3 -m unittest discover -s tests -q
      - name: DYMO Connect for Mac (the driver LabelDesk prints through)
        uses: actions/cache@v4
        with:
          path: ~/dymo.pkg
          key: ${{ env.DYMO_PKG_URL }}
      - name: Install DYMO's driver
        run: |
          [ -s ~/dymo.pkg ] || curl -fsSL -o ~/dymo.pkg "$DYMO_PKG_URL"
          sudo installer -pkg ~/dymo.pkg -target / || echo "installer reported a problem — checking the driver files anyway"
          ls -l /Library/Printers/PPDs/Contents/Resources/lw550t.ppd.gz /Library/Printers/PPDs/Contents/Resources/lw5xl.ppd.gz \
                /Library/Printers/DYMO/Filters/V2/raster2dymolw
      - name: Fake LabelWriter + tools/install-all.sh
        run: |
          mkdir -p /tmp/ldjobs
          nohup /usr/bin/python3 tests/fake_labelwriter.py /tmp/ldjobs > /tmp/fake.log 2>&1 &
          sleep 1
          tools/install-all.sh 127.0.0.1 127.0.0.1
      - name: Print through the Mac driver
        run: /usr/bin/python3 tests/print_check.py /tmp/ldjobs
      - name: Logs
        if: always()
        run: |
          cat /tmp/fake.log || true
          tail -50 ~/Library/Logs/LabelDesk.log || true
          lpstat -t || true
          sudo tail -40 /var/log/cups/error_log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printed-labels
          path: /tmp/ldjobs/*.pbm
