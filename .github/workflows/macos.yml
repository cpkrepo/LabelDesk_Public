# The Mac version on a real Mac, every push and pull request: unit tests on the Python and bash macOS ships (3.9 / 3.2),
# DYMO Connect for Mac's driver, LabelDesk installed with NO printer setup while two fake LabelWriters announce
# themselves on Bonjour → LabelDesk must add both queues itself and read their rolls (tests/auto_check.py), then a tag
# and a 4×6 print through DYMO's Mac driver (tests/print_check.py checks size, margins, orientation).
name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DYMO_PKG_URL: https://download.dymo.com/dymo/Software/Mac/DCDMac1.4.3.103.pkg
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (macOS's own python3 and bash)
        run: |
          /usr/bin/python3 --version; /bin/bash --version | head -1
          git config --global user.name ci; git config --global user.email ci@example.invalid
          /usr/bin/python3 -m unittest discover -s tests -q
      - name: DYMO Connect for Mac (the driver LabelDesk prints through)
        uses: actions/cache@v4
        with:
          path: ~/dymo.pkg
          key: ${{ env.DYMO_PKG_URL }}
      - name: Install DYMO's driver
        run: |
          [ -s ~/dymo.pkg ] || curl -fsSL -o ~/dymo.pkg "$DYMO_PKG_URL"
          sudo installer -pkg ~/dymo.pkg -target / || echo "installer reported a problem — checking the driver files anyway"
          ls -l /Library/Printers/PPDs/Contents/Resources/lw550t.ppd.gz /Library/Printers/PPDs/Contents/Resources/lw5xl.ppd.gz \
                /Library/Printers/DYMO/Filters/V2/raster2dymolw
      - name: Two fake LabelWriters announcing themselves on Bonjour; LabelDesk installed WITHOUT printer setup
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          mkdir -p /tmp/ld-tag /tmp/ld-ship
          nohup /usr/bin/python3 tests/fake_labelwriter.py /tmp/ld-tag --bind 127.0.0.1 --mdns "DYMO LabelWriter 550 Turbo" --roll 30252 > /tmp/fake-tag.log 2>&1 &
          nohup /usr/bin/python3 tests/fake_labelwriter.py /tmp/ld-ship --bind 127.0.0.2 --mdns "DYMO LabelWriter 5XL" --roll 1744907 --left 212 > /tmp/fake-ship.log 2>&1 &
          sleep 1
          tools/install-app.sh
      # macOS Local Network privacy stops a LaunchAgent's Bonjour scan ("No route to host", seen here 2026-10-10), so on
      # the Mac the queues come from tools/add-printers.sh as before; LabelDesk must say why and still read the rolls
      - name: Queues by hand (Mac), rolls read by LabelDesk
        run: |
          tools/add-printers.sh 127.0.0.1 127.0.0.2
          /usr/bin/python3 tests/auto_check.py --wait 90 --queues-by-hand
          curl -s http://127.0.0.1:8792/api/printers | /usr/bin/python3 -c "import json,sys; e=json.load(sys.stdin)['network']['error']; print('scan error shown:', e); assert e"
      - name: Print through the Mac driver on the queues LabelDesk added
        run: |
          lpstat -v
          /usr/bin/python3 tests/print_check.py /tmp/ld-tag /tmp/ld-ship
          tools/doctor.sh
      - name: Bonjour diagnostics
        if: always()
        run: |
          cd server && /usr/bin/python3 -c 'import dymo; print("browse from the shell:", dymo.browse(3), dymo.LAST)' || true
          curl -s http://127.0.0.1:8792/api/printers | /usr/bin/python3 -c 'import json,sys; print("LabelDesk (LaunchAgent) network:", json.load(sys.stdin)["network"])' || true
          perl -e 'alarm 5; exec @ARGV' dns-sd -B _pdl-datastream._tcp local. || true
          perl -e 'alarm 15; exec @ARGV' lpinfo --include-schemes dnssd -v || true
      - name: Logs
        if: always()
        run: |
          cat /tmp/fake-tag.log /tmp/fake-ship.log || true
          tail -50 ~/Library/Logs/LabelDesk.log || true
          lpstat -t || true
          sudo tail -40 /var/log/cups/error_log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printed-labels
          path: /tmp/ld-*/*.pbm
